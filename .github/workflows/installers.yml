name: Test and build installers

# Builds the Windows (NSIS) and macOS (DMG + ZIP) installers on native runners,
# then INSTALLS each one and runs tests-e2e/packaged-smoke.mjs against the installed app.
# Installers are attached to the run as artifacts (and to a GitHub Release for v* tags).

on:
  push:
    branches: [main, 'milestone-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.56.1'

jobs:
  test:
    name: Unit + end-to-end tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (real Electron window)
        run: |
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run e2e
        env:
          E2E_ELECTRON_ARGS: --no-sandbox

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build NSIS installers (x64, arm64)
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK) { Remove-Item Env:WIN_CSC_LINK, Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }  # unsigned build when no secret
          npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional code signing: add these repository secrets to sign (see README › Code signing).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Install silently (x64)
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-Setup-*-x64.exe' | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          # NSIS: /S = silent, /D = install folder (must be last, unquoted)
          Start-Process -FilePath $setup.FullName -ArgumentList '/S', '/D=C:\A3Test' -Wait
          if (!(Test-Path 'C:\A3Test\A3 Precision Drawing Studio.exe')) { throw 'Application was not installed' }
          Get-ChildItem 'C:\A3Test' | Format-Table Name, Length
      - name: Smoke test the INSTALLED app
        run: |
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          node tests-e2e/packaged-smoke.mjs "C:\A3Test\A3 Precision Drawing Studio.exe"
      - name: Build a NEWER version (99.0.0) for the auto-update test
        shell: bash # PowerShell mangles the -c.extraMetadata.version=… argument
        run: |
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD  # unsigned build when no secret
          npx electron-builder --config electron-builder.config.cjs --publish never --win --x64 -c.win.target=nsis -c.directories.output=release-update -c.extraMetadata.version=99.0.0
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Auto-update the INSTALLED app from a local update server
        run: |
          Get-ChildItem release-update | Format-Table Name, Length
          Get-Content release-update/latest.yml
          node tests-e2e/update-e2e.mjs "C:\A3Test\A3 Precision Drawing Studio.exe" release-update install 99.0.0
        shell: pwsh
      - name: Uninstall silently
        shell: pwsh
        run: |
          Start-Process -FilePath 'C:\A3Test\Uninstall A3 Precision Drawing Studio.exe' -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path 'C:\A3Test\A3 Precision Drawing Studio.exe'); $i++) { Start-Sleep 1 }
          if (Test-Path 'C:\A3Test\A3 Precision Drawing Studio.exe') { throw 'Uninstall did not remove the application' }
          Write-Host 'Uninstalled cleanly'
      # One download per installer, for people installing straight from the CI run (see INSTALL.md).
      - uses: actions/upload-artifact@v4
        with:
          name: INSTALL-Windows-x64 (most PCs)
          path: release/*-x64.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: INSTALL-Windows-ARM64
          path: release/*-arm64.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            test-results/*.png
          if-no-files-found: warn

  macos:
    name: macOS installer
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build DMG + ZIP (Apple Silicon and Intel)
        run: |
          # Blank secrets → unset, so an unsigned (ad-hoc) build is made.
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional Developer ID signing + notarisation (see README › Code signing).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify disk images and install from the DMG
        run: |
          ls -la release
          for d in release/*.dmg; do hdiutil verify "$d"; done
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=x64
          DMG=$(ls release/*-"$ARCH".dmg | head -1)
          MNT=$(hdiutil attach "$DMG" -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$MNT/A3 Precision Drawing Studio.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$MNT"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Applications/A3 Precision Drawing Studio.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions' "$RUNNER_TEMP/Applications/A3 Precision Drawing Studio.app/Contents/Info.plist"
      - name: Smoke test the INSTALLED app
        run: |
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          node tests-e2e/packaged-smoke.mjs "$RUNNER_TEMP/Applications/A3 Precision Drawing Studio.app/Contents/MacOS/A3 Precision Drawing Studio"
      - name: Build a NEWER version (99.0.0) for the update test
        run: |
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && ARCH=x64
          npx electron-builder --config electron-builder.config.cjs --publish never --mac --$ARCH -c.mac.target=zip -c.directories.output=release-update -c.extraMetadata.version=99.0.0
          ls -la release-update; cat release-update/latest-mac.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Update check of the INSTALLED app (unsigned → notify + release page)
        run: node tests-e2e/update-e2e.mjs "$RUNNER_TEMP/Applications/A3 Precision Drawing Studio.app/Contents/MacOS/A3 Precision Drawing Studio" release-update notify 99.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: INSTALL-macOS-Apple-Silicon (M1-M4)
          path: release/*-arm64.dmg
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: INSTALL-macOS-Intel
          path: release/*-x64.dmg
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            test-results/*.png
          if-no-files-found: warn

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          # latest*.yml + .blockmap are the auto-update feed read by installed apps.
          files: |
            artifacts/windows-installers/*.exe
            artifacts/windows-installers/*.blockmap
            artifacts/windows-installers/latest.yml
            artifacts/macos-installers/*.dmg
            artifacts/macos-installers/*.zip
            artifacts/macos-installers/*.blockmap
            artifacts/macos-installers/latest-mac.yml
